plugins {
    id 'fabric-loom' version '1.+'
}

version = '1.0'

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

extra {
    apply plugin: 'fabric-loom'
    minecraft {
        version = '1.20.1'
        mappings = '1.20.1+build.1'
        runs {
            client {
                property 'fabric.dli.main', 'com.example.spellbookmod.SpellbookMod'
            }
            server {
                property 'fabric.dli.main', 'com.example.spellbookmod.SpellbookMod'
            }
        }
    }
}
